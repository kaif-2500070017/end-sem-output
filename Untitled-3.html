
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Academic Database</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    padding: 25px;
}

header {
    background: #172554;
    color: white;
    padding: 25px;
    text-align: center;
    border-radius: 12px;
}

.dashboard {
    display: flex;
    gap: 20px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 25px;
    flex: 1;
    min-width: 150px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ddd;
    text-align: center;
}

.card h2 {
    color: #2563eb;
    margin-top: 10px;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

h3 {
    margin-bottom: 18px;
    color: #172554;
}

form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input, select, button {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 100%;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    padding: 13px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background: #172554;
    color: white;
}

.delete {
    background: #dc2626;
}

.search {
    margin-bottom: 15px;
    max-width: 350px;
}

.table-box {
    overflow-x: auto;
}

@media(max-width:600px) {
    form {
        grid-template-columns: 1fr;
    }
    body {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Academic Database</h1>
    <p>Student Records Management System</p>
</header>

<div class="dashboard">
    <div class="card">
        Total Students
        <h2 id="total">0</h2>
    </div>

    <div class="card">
        Average Percentage
        <h2 id="average">0%</h2>
    </div>

    <div class="card">
        Departments
        <h2 id="departments">0</h2>
    </div>
</div>

<div class="container">
    <h3>➕ Add Student Details</h3>

    <form id="studentForm">
        <input id="sid" placeholder="Student ID" required>
        <input id="name" placeholder="Student Name" required>

        <select id="department" required>
            <option value="">Select Department</option>
            <option>Mechanical</option>
            <option>Computer Science</option>
            <option>Electrical</option>
            <option>Civil</option>
            <option>Electronics</option>
        </select>

        <select id="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <input id="marks" type="number"
        placeholder="Marks (out of 100)" min="0" max="100" required>

        <button type="submit">Add Student</button>
    </form>
</div>

<div class="container">
    <h3>📚 Student Academic Records</h3>

    <input class="search" id="search"
    placeholder="Search student by name or ID...">

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Marks</th>
                    <th>Percentage</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="records"></tbody>
        </table>
    </div>
</div>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [];

const form = document.getElementById("studentForm");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    let student = {
        id: document.getElementById("sid").value.trim(),
        name: document.getElementById("name").value.trim(),
        department: document.getElementById("department").value,
        year: document.getElementById("year").value,
        marks: Number(document.getElementById("marks").value)
    };

    if (students.some(s => s.id.toLowerCase() === student.id.toLowerCase())) {
        alert("Student ID already exists!");
        return;
    }

    student.percentage = student.marks;

    students.push(student);

    localStorage.setItem("students", JSON.stringify(students));

    form.reset();
    displayStudents();
});

function displayStudents() {
    let records = document.getElementById("records");
    let search = document.getElementById("search").value.toLowerCase();

    records.innerHTML = "";

    let filtered = students.filter(s =>
        s.name.toLowerCase().includes(search) ||
        s.id.toLowerCase().includes(search)
    );

    filtered.forEach((s) => {
        let index = students.indexOf(s);

        records.innerHTML += `
        <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.department}</td>
            <td>${s.year}</td>
            <td>${s.marks}</td>
            <td>${s.percentage}%</td>
            <td>
                <button class="delete"
                onclick="deleteStudent(${index})">
                Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("total").innerText = students.length;

    let avg = students.length ?
        students.reduce((sum, s) => sum + s.marks, 0) / students.length : 0;

    document.getElementById("average").innerText =
        avg.toFixed(1) + "%";

    document.getElementById("departments").innerText =
        new Set(students.map(s => s.department)).size;
}

function deleteStudent(index) {
    if(confirm("Delete this student record?")) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
    }
}

document.getElementById("search").addEventListener("input", displayStudents);

displayStudents();

</script>

</body>
</html>
